name: build-ios-video-default

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install requirements
        run: |
          brew install go meson ninja nasm make
          # Download cmake 3.x (cmake 4.x breaks iOS cross-compilation)
          curl -L https://github.com/Kitware/CMake/releases/download/v3.31.7/cmake-3.31.7-macos-universal.tar.gz -o /tmp/cmake.tar.gz
          sudo tar -xzf /tmp/cmake.tar.gz -C /opt/
          sudo ln -sf /opt/cmake-3.31.7-macos-universal/CMake.app/Contents/bin/cmake /usr/local/bin/cmake
          sudo ln -sf /opt/cmake-3.31.7-macos-universal/CMake.app/Contents/share/cmake /usr/local/share/cmake
          # Remove brew cmake so cmake 3.x is used
          brew uninstall --ignore-dependencies cmake 2>/dev/null || true
          cmake --version

      - name: Print tool versions
        run: gmake tool-versions || true

      - name: Determine version
        id: version
        run: |
          case "${GITHUB_REF}" in
          refs/tags/*)
            VERSION=${GITHUB_REF#refs/tags/}
            ;;
          *)
            VERSION=develop
            ;;
          esac
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build iOS arm64 video-default
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          VERSION=${{ steps.version.outputs.version }}
          gmake build/output/libmpv-libs_${VERSION}_ios-arm64-video-default.tar.gz

      - name: Build iOS Simulator arm64 video-default
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gmake build/output/libmpv-libs_${VERSION}_iossimulator-arm64-video-default.tar.gz

      - name: Build iOS Simulator amd64 video-default
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gmake build/output/libmpv-libs_${VERSION}_iossimulator-amd64-video-default.tar.gz

      - name: Create universal simulator libs
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gmake build/output/libmpv-libs_${VERSION}_iossimulator-universal-video-default.tar.gz

      - name: Create iOS xcframeworks
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gmake build/output/libmpv-xcframeworks_${VERSION}_ios-universal-video-default.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-xcframeworks-ios-video-default
          path: build/output/libmpv-xcframeworks_*_ios-universal-video-default.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/output/libmpv-xcframeworks_*_ios-universal-video-default.tar.gz
